<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MintScope" />
  <title>MintScope · TCG Helper</title>
  <link rel="stylesheet" href="style.css?v=42" />
  <link rel="manifest" href="manifest.json?v=42" />
</head>
<body>
  <div class="bgGlow bgOne"></div>
  <div class="bgGlow bgTwo"></div>
  <main class="app">
    <header class="hero">
      <div class="brandMark">MS</div>
      <div class="brandText">
        <h1>MintScope</h1>
        <p>TCG price helper · v43</p>
      </div>
      <span class="pill">FREE</span>
    </header>

    <section class="card quickPanel">
      <label class="label" for="quickInput">Snel zoeken</label>
      <div class="quickWrap">
        <input id="quickInput" class="quick" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="jp base 002 ivysaur nm" />
        <button id="quickGo" class="quickGo" type="button" title="Maak link">↵</button>
      </div>
      <div class="examples" id="exampleChips">
        <button type="button" data-fill="jp base 002 ivysaur nm">JP Base Ivysaur</button>
        <button type="button" data-fill="jp fossil 094 gengar nm">JP Fossil Gengar</button>
        <button type="button" data-fill="jp neo revelation 220 swinub nm">JP Neo Swinub</button>
        <button type="button" data-fill="shining gyarados 65 nm">Shining Gyarados</button>
        <button type="button" data-fill="en delta charizard 4 nm">Delta Charizard</button>
      </div>
    </section>

    <section class="card formPanel">
      <div class="row two">
        <div>
          <label class="label" for="numberInput">Nummer</label>
          <input id="numberInput" autocomplete="off" placeholder="57 / 002" />
        </div>
        <div>
          <label class="label" for="nameInput">Naam</label>
          <input id="nameInput" autocomplete="off" placeholder="Swinub" />
        </div>
      </div>
      <div class="row three">
        <div>
          <label class="label" for="setSelect">Set</label>
          <select id="setSelect">
            <option>AUTO</option>
            <option>BASE</option>
            <option>JUNGLE</option>
            <option>FOSSIL</option>
            <option>ROCKET</option>
            <option>GYM HEROES</option>
            <option>GYM CHALLENGE</option>
            <option>NEO GENESIS</option>
            <option>NEO DISCOVERY</option>
            <option>NEO REVELATION</option>
            <option>NEO DESTINY</option>
            <option>SOUTHERN ISLANDS</option>
            <option>WOTC PROMO</option>
            <option>EXPEDITION</option>
            <option>AQUAPOLIS</option>
            <option>SKYRIDGE</option>
            <option>EX DELTA SPECIES</option>
            <option>EX CRYSTAL GUARDIANS</option>
          </select>
        </div>
        <div>
          <label class="label" for="langSelect">Taal</label>
          <select id="langSelect">
            <option>JP</option>
            <option>EN</option>
          </select>
        </div>
        <div>
          <label class="label" for="condSelect">Staat</label>
          <select id="condSelect">
            <option>NM</option>
            <option>EX</option>
            <option>GD</option>
            <option>PL</option>
          </select>
        </div>
      </div>
    </section>

    <section class="actions">
      <button id="makeBtn" type="button" class="primary">Maak link</button>
      <a id="openBtn" class="open disabled" href="#" target="_blank" rel="noopener">Open CM</a>
      <button id="favoriteBtn" type="button" class="secondary">⭐ Favoriet</button>
      <button id="clearBtn" type="button" class="ghost">Leeg</button>
    </section>

    <section class="card resultPanel">
      <div class="statusLine">
        <div id="status" class="status">Klaar.</div>
        <button id="copyBtn" type="button" class="tinyBtn">Kopieer</button>
      </div>
      <textarea id="urlBox" readonly placeholder="Cardmarket-link komt hier"></textarea>
      <div id="matchBox" class="matchBox"></div>
    </section>

    <section class="card savedPanel">
      <div class="sectionHeader">
        <h2>Recent</h2>
        <button id="clearRecentBtn" type="button" class="tinyBtn danger">Wis</button>
      </div>
      <div id="recentList" class="savedList empty">Nog geen recente zoekopdrachten.</div>
    </section>

    <section class="card savedPanel">
      <div class="sectionHeader">
        <h2>Favorieten</h2>
        <button id="clearFavBtn" type="button" class="tinyBtn danger">Wis</button>
      </div>
      <div id="favoriteList" class="savedList empty">Nog geen favorieten.</div>
    </section>

    <section class="note">
      Enter maakt en kopieert alleen een link. Open Cardmarket pas wanneer nodig, zodat je minder snel rate-limits krijgt.
    </section>
  </main>
  <script src="app.js?v=42"></script>
</body>
</html>
