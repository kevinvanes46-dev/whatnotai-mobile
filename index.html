<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>WhatnotAI Mobile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>WhatnotAI</h1>
        <p>Mobile Cardmarket helper</p>
      </div>
      <span class="pill">FREE</span>
    </header>

    <section class="card panel">
      <label class="label" for="quickInput">Snelinvoer</label>
      <input id="quickInput" class="quick" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="jp base 002 ivysaur nm" />
      <div class="examples">
        <button data-fill="jp base 002 ivysaur nm">JP Base Ivysaur</button>
        <button data-fill="jp fossil 094 gengar nm">JP Fossil Gengar</button>
        <button data-fill="en neo revelation 57 swinub nm">EN Swinub</button>
      </div>
    </section>

    <section class="grid2 panel">
      <div>
        <label class="label" for="numberInput">Nummer</label>
        <input id="numberInput" autocomplete="off" placeholder="57 / 002" />
      </div>
      <div>
        <label class="label" for="nameInput">Naam</label>
        <input id="nameInput" autocomplete="off" placeholder="Swinub" />
      </div>
      <div>
        <label class="label" for="setSelect">Set</label>
        <select id="setSelect">
          <option>AUTO</option>
          <option>BASE</option>
          <option>JUNGLE</option>
          <option>FOSSIL</option>
          <option>ROCKET</option>
          <option>GYM HEROES</option>
          <option>GYM CHALLENGE</option>
          <option>NEO GENESIS</option>
          <option>NEO DISCOVERY</option>
          <option>NEO REVELATION</option>
          <option>NEO DESTINY</option>
          <option>EX DELTA SPECIES</option>
        </select>
      </div>
      <div class="minirow">
        <div>
          <label class="label" for="langSelect">Taal</label>
          <select id="langSelect">
            <option>JP</option>
            <option>EN</option>
          </select>
        </div>
        <div>
          <label class="label" for="condSelect">Staat</label>
          <select id="condSelect">
            <option>NM</option>
            <option>EX</option>
            <option>GD</option>
            <option>PL</option>
          </select>
        </div>
      </div>
    </section>

    <section class="actions">
      <button id="makeBtn" class="primary">Maak link</button>
      <a id="openBtn" class="open disabled" href="#" target="_blank" rel="noopener">Open Cardmarket op deze telefoon</a>
      <button id="copyBtn" class="secondary">Kopieer link</button>
      <button id="clearBtn" class="ghost">Leeg</button>
    </section>

    <section class="panel resultPanel">
      <div id="status" class="status">Klaar.</div>
      <textarea id="urlBox" readonly placeholder="Cardmarket URL komt hier"></textarea>
      <div id="matchBox" class="matchBox"></div>
    </section>

    <section class="panel note">
      <b>Tip:</b> JP vintage gebruikt aparte Cardmarket-pagina’s. Dus <code>jp base 002 ivysaur nm</code> opent Expansion Pack / Ivysaur, niet Engelse Base Set #2.
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
